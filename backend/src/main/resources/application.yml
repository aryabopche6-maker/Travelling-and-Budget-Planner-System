server:
  port: ${PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: wanderplan-backend

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/wanderplandb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 hours
  frontend:
    url: ${FRONTEND_URL:https://travelling-and-budget-planner-syste.vercel.app}
  invitation:
    expiry-days: 7
  auth:
    password-reset-expiry-minutes: ${PASSWORD_RESET_EXPIRY_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ORIGIN:https://travelling-and-budget-planner-syste.vercel.app,http://localhost:5173}
  external:
    places:
      api-key: ${PLACES_API_KEY:NO_KEY}
    hotels:
      api-key: ${HOTEL_API_KEY:NO_KEY}
      client-id: ${AMADEUS_CLIENT_ID:NO_KEY}
      client-secret: ${AMADEUS_CLIENT_SECRET:NO_KEY}
  upload:
    dir: uploads
